name: Build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: powershell
        run: .\build.ps1 -Test
      - uses: actions/upload-artifact@v4
        with:
          name: DuoClick-Windows
          path: |
            dist/DuoClick.exe
            dist/DuoClick.exe.config
            dist/DuoClick-*-Windows.zip
            dist/*.sha256
